<script>
(function () {
  if (window.EV) return;
  var NS = 'http://www.w3.org/2000/svg';
  window.EV = {
    C: { bg: '#121212', ink: '#f0f0f0', ink2: '#c3c2b7', grid: '#2a2a2a', dim: '#4a4a4a', blue: '#3987e5', orange: '#d95926', aqua: '#199e70', gold: '#c98500' },
    el: function (tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      for (var a in attrs) e.setAttribute(a, attrs[a]);
      if (parent) parent.appendChild(e);
      return e;
    },
    clear: function (g) { while (g.firstChild) g.removeChild(g.firstChild); },
    path: function (pts) {
      var d = '';
      for (var i = 0; i < pts.length; i++) d += (i ? 'L' : 'M') + pts[i][0].toFixed(2) + ',' + pts[i][1].toFixed(2);
      return d;
    },
    // pointer position in SVG user units
    pt: function (svg, e) {
      var p = svg.createSVGPoint();
      var src = e.touches ? e.touches[0] : e;
      p.x = src.clientX; p.y = src.clientY;
      return p.matrixTransform(svg.getScreenCTM().inverse());
    },
    // drag handler: cb(point) on press and move
    drag: function (svg, target, cb) {
      var on = false;
      function mv(e) { if (!on) return; cb(EV.pt(svg, e)); e.preventDefault(); }
      target.addEventListener('pointerdown', function (e) { on = true; target.setPointerCapture && target.setPointerCapture(e.pointerId); cb(EV.pt(svg, e)); e.preventDefault(); });
      target.addEventListener('pointermove', mv);
      target.addEventListener('pointerup', function () { on = false; });
      target.addEventListener('pointercancel', function () { on = false; });
    },
    // Back / Next stepper: opts.root, opts.n, opts.render(i)
    stepper: function (opts) {
      var root = opts.root, i = 0;
      var prev = root.querySelector('.mv-prev'), next = root.querySelector('.mv-next'), cnt = root.querySelector('.mv-step');
      function go(d) {
        i = Math.max(0, Math.min(opts.n - 1, i + d));
        opts.render(i);
        if (cnt) cnt.textContent = (i + 1) + ' / ' + opts.n;
        if (prev) prev.disabled = i === 0;
        if (next) next.disabled = i === opts.n - 1;
      }
      if (prev) prev.addEventListener('click', function () { go(-1); });
      if (next) next.addEventListener('click', function () { go(1); });
      root.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
        if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
      });
      go(0);
      return { go: go, get: function () { return i; } };
    },
    // unwrap an angle sequence and return total turning / 2pi
    winding: function (angles) {
      var acc = 0;
      for (var i = 1; i < angles.length; i++) {
        var d = angles[i] - angles[i - 1];
        while (d > Math.PI) d -= 2 * Math.PI;
        while (d < -Math.PI) d += 2 * Math.PI;
        acc += d;
      }
      return acc / (2 * Math.PI);
    }
  };
})();
(function () {
  if (window.CS) return;
  window.CS = {};
  CS.ready = function (cb) {
    var n = 0;
    (function wait() {
      if (typeof THREE !== 'undefined') { cb(window.THREE); return; }
      if (++n > 300) return;
      setTimeout(wait, 40);
    })();
  };
  CS.mount = function (opts) {
    CS.ready(function (THREE) {
      var el = document.getElementById(opts.id);
      if (!el || el.getAttribute('data-cs') === '1') return;
      function boot() {
        if (el.clientWidth < 16) { setTimeout(boot, 120); return; }
        if (el.getAttribute('data-cs') === '1') return;
        el.setAttribute('data-cs', '1');
        var height = opts.height || el.clientHeight || 420;
        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121212);
        var camera;
        if (opts.ortho) {
          var halfW = opts.orthoHalf || 3.3;
          var asp = el.clientWidth / height;
          camera = new THREE.OrthographicCamera(-halfW, halfW, halfW / asp, -halfW / asp, 0.05, 80);
        } else {
          camera = new THREE.PerspectiveCamera(50, el.clientWidth / height, 0.05, 200);
        }
        var cam = opts.cam || [0, 0.35, 4.1];
        camera.position.set(cam[0], cam[1], cam[2]);
        if (el.clientWidth < 520 && !opts.ortho) camera.position.multiplyScalar(1.25);
        var renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(el.clientWidth, height);
        renderer.domElement.style.display = 'block';
        el.insertBefore(renderer.domElement, el.firstChild);
        var group = new THREE.Group();
        scene.add(group);
        if (!opts.noLights) {
          scene.add(new THREE.AmbientLight(0xffffff, 0.45));
          var d1 = new THREE.DirectionalLight(0xffffff, 0.9);
          d1.position.set(5, 5, 6);
          scene.add(d1);
          var d2 = new THREE.DirectionalLight(0x9db8e8, 0.35);
          d2.position.set(-5, -2, -4);
          scene.add(d2);
        }
        var rotX = opts.rotX || 0.28;
        var rotY = opts.rotY || 0.45;
        var dragging = false, lx = 0, ly = 0, visible = true;
        var cvs = renderer.domElement;
        cvs.style.cursor = opts.freeze ? 'default' : 'grab';
        function down(x, y) { dragging = true; lx = x; ly = y; }
        function move(x, y) {
          if (!dragging) return;
          rotY += (x - lx) * 0.008;
          rotX += (y - ly) * 0.008;
          if (rotX > 1.35) rotX = 1.35;
          if (rotX < -1.35) rotX = -1.35;
          lx = x; ly = y;
        }
        function up() { dragging = false; }
        cvs.addEventListener('mousedown', function (e) { down(e.clientX, e.clientY); });
        window.addEventListener('mouseup', up);
        window.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
        cvs.addEventListener('touchstart', function (e) {
          if (e.touches[0]) down(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        cvs.addEventListener('touchend', up);
        cvs.addEventListener('touchmove', function (e) {
          if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('resize', function () {
          var w = el.clientWidth;
          if (w < 16) return;
          if (camera.isOrthographicCamera) {
            var hW = opts.orthoHalf || 3.3;
            var a = w / height;
            camera.left = -hW; camera.right = hW;
            camera.top = hW / a; camera.bottom = -hW / a;
          } else {
            camera.aspect = w / height;
          }
          camera.updateProjectionMatrix();
          renderer.setSize(w, height);
        });

          var io = new IntersectionObserver(function (ents) {
            visible = !!(ents[0] && ents[0].isIntersecting);
          }, { threshold: 0.04 });
          io.observe(el);
        }
        var api = { THREE: THREE, el: el, scene: scene, camera: camera, renderer: renderer, group: group };
        var tick = opts.setup ? opts.setup(api) : null;
        (function loop() {
          requestAnimationFrame(loop);
          if (!visible) return;
          if (!opts.freeze && !opts.noSpin && !dragging) rotY += 0.0028;
          if (!opts.freeze) group.rotation.set(rotX, rotY, 0);
          if (tick) tick(api);
          renderer.render(scene, camera);
        })();
      }
      boot();
    });
  };
})();
</script>
