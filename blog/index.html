layout: default
title: Julian Henry — polyglot / software engineer / author
---
<ul class="posts">

  {% for post in site.posts %}
    {% unless post.redirect_to %}
    <li><span>{{ post.date | date_to_string }}</span><a href="{{ post.url }}" title="{{ post.title }}">{{ post.title }}</a></li>
    {% endunless %}
  {% endfor %}
    
</ul>
